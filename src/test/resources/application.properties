# Test context: self-contained, no external MySQL or auth service required.
#
# The main application.properties pins `spring.profiles.active=prod`, whose datasource reads
# ${DB_URL} from the environment — so the context test could never load on a clean machine.
# These overrides give tests an in-memory database and neutral defaults instead.
spring.profiles.active=test

spring.datasource.url=jdbc:h2:mem:pdfstudio;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# The JWKS URI is only dereferenced when a token is actually validated, so a placeholder is
# enough for the context to start.
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:0/.well-known/jwks.json
app.auth.expected-issuer=https://auth.test
app.auth.expected-audience=pdf-studio-api

# Play verification stays disabled (no key) — PlayStoreVerifier degrades to "invalid" safely.
app.play.service-account-key-path=
app.play.package-name=solutions.laxmi.pdfcraft
app.play.rtdn-secret=
app.play.webhook.audience=
app.play.webhook.service-account=
