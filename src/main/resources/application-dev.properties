server.port=8082

# Local MySQL for the credit tables.
spring.datasource.url=jdbc:mysql://localhost:3306/pdfstudio_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
