spring.application.name=pdf-studio-api
spring.profiles.active=prod
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
springdoc.api-docs.path=/api-docs

# ---- Auth: validate RS256 tokens from the standalone auth service via its JWKS ----
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${AUTH_JWKS_URI:http://localhost:8081/.well-known/jwks.json}
# Access tokens must carry this issuer claim (matches the auth service's app.jwt.issuer).
app.auth.expected-issuer=${AUTH_ISSUER:https://auth.laxmi.solutions}
# ...and this audience — the auth service's id for THIS product. A token minted for a
# different product (different aud) is rejected, preventing cross-product token reuse.
app.auth.expected-audience=${AUTH_AUDIENCE:pdf-studio-api}

# ---- JPA (credit tables; schema also defined in sql-init/init.sql) ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ---- Google Play (INAPP credit purchase verification + RTDN void clawback) ----
app.play.service-account-key-path=${PLAY_SERVICE_ACCOUNT_KEY_PATH:}
app.play.package-name=${PLAY_PACKAGE_NAME:solutions.laxmi.pdfcraft}
# Shared secret guarding the machine-to-machine RTDN webhook (query param).
app.play.rtdn-secret=${PLAY_RTDN_SECRET:}
# Pub/Sub push OIDC verification (stronger than the secret): the audience configured on
# the push subscription (typically the webhook URL) and, optionally, the signer service
# account email. When the audience is set, a valid Google OIDC token is required.
app.play.webhook.audience=${PLAY_RTDN_AUDIENCE:}
app.play.webhook.service-account=${PLAY_RTDN_SERVICE_ACCOUNT:}

# ---- Credit economy ----
app.credits.welcome-grant=10
app.credits.daily-allowance=3
app.credits.rewarded-ad-grant=2
app.credits.rewarded-ad-daily-cap=10