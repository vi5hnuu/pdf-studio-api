spring.application.name=pdf-studio-api
spring.profiles.active=dev
spring.servlet.multipart.max-file-size=${MULTIPART_MAX_FILE_SIZE:50MB}
spring.servlet.multipart.max-request-size=${MULTIPART_MAX_REQUEST_SIZE:100MB}
# Spill every upload straight to disk rather than buffering it in the heap first. Tools read
# the part as a file (see TempFiles), so nothing gains from an in-memory staging copy.
spring.servlet.multipart.file-size-threshold=0B
springdoc.api-docs.path=/api-docs

# ---- Upload guards (bound the WORK, not just the bytes on the wire) ----------
# A small PDF can still hold tens of thousands of pages, and several tools render every
# page, so page count is what actually predicts CPU/memory. See UploadProperties.
app.upload.max-files=${UPLOAD_MAX_FILES:50}
app.upload.max-pages=${UPLOAD_MAX_PAGES:2000}
# Tools that rasterise every page (pdf-to-jpg, remove-blank-pages, analyze) cost far more
# per page, so they get a lower ceiling.
app.upload.max-render-pages=${UPLOAD_MAX_RENDER_PAGES:500}

# ---- Load shedding: bound concurrent heavy work ------------------------------
# Tomcat serves ~200 requests concurrently; a large render can hold hundreds of MB, so
# admission is capped and excess requests get a 503 + Retry-After instead of an OOM.
# max-concurrent-heavy is intentionally not set here: LoadProperties derives it from the
# CPU count. Override per deployment with APP_LOAD_MAX_CONCURRENT_HEAVY.
app.load.queue-timeout-seconds=${LOAD_QUEUE_TIMEOUT_SECONDS:20}
app.load.retry-after-seconds=${LOAD_RETRY_AFTER_SECONDS:15}
# Documents at/above this size get PDFBox's temp-file stream cache; smaller ones stay in
# memory, which is faster and whose footprint does not matter.
app.load.scratch-file-threshold-bytes=${LOAD_SCRATCH_THRESHOLD_BYTES:8388608}

# ---- Rate limiting (per user AND per IP; the IP bucket is what bounds free guests) ----
app.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
app.rate-limit.user-capacity=${RATE_LIMIT_USER_CAPACITY:60}
app.rate-limit.user-refill-per-minute=${RATE_LIMIT_USER_REFILL:60}
app.rate-limit.ip-capacity=${RATE_LIMIT_IP_CAPACITY:120}
app.rate-limit.ip-refill-per-minute=${RATE_LIMIT_IP_REFILL:120}
app.rate-limit.heavy-capacity=${RATE_LIMIT_HEAVY_CAPACITY:12}
app.rate-limit.heavy-refill-per-minute=${RATE_LIMIT_HEAVY_REFILL:12}

# ---- CORS -------------------------------------------------------------------
# Comma-separated browser origins allowed to call this API. Empty falls back to the
# built-in defaults: localhost in dev, the product domains in prod.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

# ---- Actuator: health only, no env/beans/metrics exposure -------------------
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# ---- Auth: validate RS256 tokens from the auth service instances via their JWKS ----
# A token must carry this audience — this product's id. One minted for a different
# product is rejected, preventing cross-product token reuse.
app.auth.expected-audience=${AUTH_AUDIENCE:pdf-studio-api}
#
# One auth deployment issues tokens for both the mobile app and the web tier, so a bare
# subject is unique on its own and this service keys every per-user record by that subject.
app.auth.issuer=${AUTH_ISSUER:https://auth.laxmi.solutions}
app.auth.jwks-uri=${AUTH_JWKS_URI:http://localhost:8081/.well-known/jwks.json}
app.auth.internal-base-url=${AUTH_INTERNAL_URL:http://localhost:8081/api/v1}

# ---- JPA + Flyway -----------------------------------------------------------
# Flyway owns the schema (src/main/resources/db/migration); Hibernate only checks that the
# mapping still matches it. Letting ddl-auto mutate live billing tables is not acceptable.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ---- Google Play (INAPP credit purchase verification + RTDN void clawback) ----
app.play.service-account-key-path=${PLAY_SERVICE_ACCOUNT_KEY_PATH:}
# Must match the app's applicationId exactly — Play's purchases.products.get is keyed by
# it, so a wrong value fails every purchase verification. The app ships as com.vi5hnu.pdf_craft
# (android/app/build.gradle); this previously defaulted to a different id entirely.
app.play.package-name=${PLAY_PACKAGE_NAME:com.vi5hnu.pdf_craft}
# Shared secret guarding the machine-to-machine RTDN webhook (query param).
app.play.rtdn-secret=${PLAY_RTDN_SECRET:}

# Shared secret for server-to-server calls into the auth service (guest retention).
# Blank disables them, so a missing value degrades to the old behaviour rather than failing.
app.auth.internal-secret=${AUTH_INTERNAL_SECRET:}

# Nightly backstop for refunds the RTDN webhook never received. Google retains voided
# purchases for 30 days, so the window can be generous; re-offering a token already clawed
# back is a no-op.
app.play.voided-sweep-days=${PLAY_VOIDED_SWEEP_DAYS:7}
app.play.voided-sweep-cron=${PLAY_VOIDED_SWEEP_CRON:0 45 3 * * *}
# Pub/Sub push OIDC verification (stronger than the secret): the audience configured on
# the push subscription (typically the webhook URL) and, optionally, the signer service
# account email. When the audience is set, a valid Google OIDC token is required.
app.play.webhook.audience=${PLAY_RTDN_AUDIENCE:}
app.play.webhook.service-account=${PLAY_RTDN_SERVICE_ACCOUNT:}

# ---- Credit economy ----
app.credits.welcome-grant=10
app.credits.daily-allowance=3
app.credits.rewarded-ad-grant=2
app.credits.rewarded-ad-daily-cap=10
# Free grants are rationed per client IP as well as per account, because web guest
# accounts cost nothing to create. 0 disables a cap.
app.credits.welcome-grants-per-ip-per-day=${CREDITS_WELCOME_PER_IP:5}
app.credits.daily-grants-per-ip-per-day=${CREDITS_DAILY_PER_IP:5}
# Salt for the stored IP hashes — set a real value per deployment.
app.credits.ip-hash-salt=${CREDITS_IP_HASH_SALT:pdf-studio-default-salt}

# ---- Logging ----
# Hibernate logs every SQLIntegrityConstraintViolationException at ERROR, including the one
# that fires every time a legitimate RTDN-vs-client race hits uq(user_id, "purchase:<token>"):
# the loser's insert is caught cleanly in CreditsService.purchaseCredits / .reconcilePurchase,
# so the ERROR tag on the noise it leaves behind is wrong — the request still succeeds.
# WARN keeps the trail (useful when something new is actually broken) without pretending the
# usual case is a failure.
logging.level.org.hibernate.engine.jdbc.spi.SqlExceptionHelper=WARN